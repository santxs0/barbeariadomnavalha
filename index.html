<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Dom Navalha - Catálogo Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#facc15',
                            500: '#d97706',
                            600: '#b45309',
                            glow: '#eab308',
                        },
                        darkbg: '#0a0a0c',
                        darkcard: '#121216',
                        lightbg: '#f8fafc',
                        lightcard: '#ffffff'
                    },
                    fontFamily: {
                        title: ['Cinzel', 'serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #d97706 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border-glow {
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.15);
        }
        /* Transição suave de tema */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 font-body min-h-screen pb-32 dark:bg-darkbg dark:text-slate-100 bg-lightbg text-slate-900 transition-colors duration-300">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-opacity-80 border-b border-amber-500/20 dark:bg-darkbg/90 bg-white/90 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-400 p-[2px] flex items-center justify-center">
                    <div class="w-full h-full dark:bg-darkbg bg-slate-900 rounded-full flex items-center justify-center">
                        <i class="fa-solid font-bold text-amber-400 fa-scissors text-lg"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-title text-lg md:text-xl font-bold tracking-wider gold-gradient-text">DOM NAVALHA</h1>
                    <p class="text-[10px] uppercase tracking-widest text-amber-500/80 -mt-1 font-semibold">Barbershop Premium</p>
                </div>
            </div>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-full border border-amber-500/30 hover:border-amber-500/60 dark:bg-darkcard bg-slate-100 text-amber-500 transition-all duration-300 shadow-md flex items-center justify-center">
                <i id="themeIcon" class="fa-solid fa-sun text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Hero / Header Banner -->
    <section class="relative overflow-hidden py-8 px-4 text-center border-b border-amber-500/10">
        <div class="max-w-2xl mx-auto space-y-3">
            <span class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-widest rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/30">
                <i class="fa-solid fa-crown mr-1"></i> Experiência Exclusiva
            </span>
            <h2 class="text-2xl md:text-3xl font-title font-bold leading-tight">Estilo, Tradição e Excelência</h2>
            <p class="text-sm dark:text-slate-400 text-slate-600 max-w-md mx-auto">
                Selecione os serviços desejados abaixo para calcular o tempo estimado e agendar seu horário direto no WhatsApp.
            </p>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Search & Filter Controls -->
        <div class="mb-8 space-y-4">
            <!-- Filter Tabs -->
            <div class="flex items-center justify-start md:justify-center space-x-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('all')" class="category-btn active px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 whitespace-nowrap bg-amber-500 text-black shadow-lg shadow-amber-500/20" data-cat="all">
                    <i class="fa-solid fa-border-all mr-1.5"></i> Todos
                </button>
                <button onclick="filterCategory('corte')" class="category-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 whitespace-nowrap dark:bg-darkcard bg-white dark:text-slate-300 text-slate-700 border border-slate-700/20 hover:border-amber-500/50" data-cat="corte">
                    <i class="fa-solid fa-scissors mr-1.5"></i> Cabelo
                </button>
                <button onclick="filterCategory('barba')" class="category-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 whitespace-nowrap dark:bg-darkcard bg-white dark:text-slate-300 text-slate-700 border border-slate-700/20 hover:border-amber-500/50" data-cat="barba">
                    <i class="fa-solid fa-user-ninja mr-1.5"></i> Barba
                </button>
                <button onclick="filterCategory('combo')" class="category-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 whitespace-nowrap dark:bg-darkcard bg-white dark:text-slate-300 text-slate-700 border border-slate-700/20 hover:border-amber-500/50" data-cat="combo">
                    <i class="fa-solid fa-gem mr-1.5"></i> Combos VIP
                </button>
                <button onclick="filterCategory('tratamento')" class="category-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 whitespace-nowrap dark:bg-darkcard bg-white dark:text-slate-300 text-slate-700 border border-slate-700/20 hover:border-amber-500/50" data-cat="tratamento">
                    <i class="fa-solid fa-sparkles mr-1.5"></i> Tratamentos
                </button>
            </div>
        </div>

        <!-- Catalog Grid -->
        <div id="servicesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Dynamic Content loaded via JS -->
        </div>
    </main>

    <!-- Floating Booking Summary Bar (Cart) -->
    <div id="bookingBar" class="fixed bottom-0 left-0 right-0 z-50 p-4 transition-transform duration-500 transform translate-y-full">
        <div class="max-w-2xl mx-auto rounded-2xl dark:bg-darkcard/95 bg-white/95 backdrop-blur-lg border border-amber-500/40 p-4 shadow-2xl gold-border-glow">
            <div class="flex items-center justify-between mb-3 border-b dark:border-slate-800 border-slate-200 pb-2">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-amber-500 animate-ping"></span>
                    <span class="font-title text-sm font-bold tracking-wide uppercase">Resumo da Seleção</span>
                </div>
                <div class="text-xs dark:text-slate-400 text-slate-500">
                    <span id="selectedCount" class="font-bold text-amber-500">0</span> serviço(s)
                </div>
            </div>

            <div class="flex items-center justify-between gap-4">
                <div>
                    <div class="text-xs dark:text-slate-400 text-slate-500 flex items-center gap-1">
                        <i class="fa-regular fa-clock"></i> Tempo: <span id="totalTime" class="font-semibold dark:text-slate-200 text-slate-800">0 min</span>
                    </div>
                    <div class="text-xl md:text-2xl font-bold text-amber-500">
                        R$ <span id="totalPrice">0,00</span>
                    </div>
                </div>

                <button onclick="sendToWhatsApp()" class="flex-1 max-w-[220px] bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 transition-all transform active:scale-95">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span class="text-sm">Agendar Agora</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Data Store (Fictitious Services Data)
        const services = [
            {
                id: 1,
                name: "Corte Executive Fade",
                category: "corte",
                price: 55.00,
                duration: 45,
                description: "Degradê moderno com acabamento na navalha, alinhamento de pezinho e finalização com pomada alinhadora importada.",
                badge: "Mais Pedido",
                image: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "Corte Clássico Scissor Cut",
                category: "corte",
                price: 50.00,
                duration: 40,
                description: "Corte tradicional 100% executado na tesoura para homens que preferem um visual elegante, encorpado e atemporal.",
                badge: "Clássico",
                image: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "Barba Terapia Tradicional",
                category: "barba",
                price: 45.00,
                duration: 35,
                description: "Modelagem completa da barba com toalha quente, óleos essenciais hidratantes, massagem facial e pós-barba suavizante.",
                badge: "Relaxante",
                image: "https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "Barba Express Navalhada",
                category: "barba",
                price: 35.00,
                duration: 25,
                description: "Desenhado rápido da barba na navalha com alinhamento das linhas do pescoço e bochecha. Ideal para manutenção.",
                badge: "Rápido",
                image: "https://images.unsplash.com/photo-1517832606589-715006d31d61?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                name: "Combo Imperador Dom Navalha",
                category: "combo",
                price: 95.00,
                duration: 75,
                description: "O tratamento completo: Corte Executive + Barba Terapia + Lavagem Especial com Massagem Capilar + Cerveja Artesanal de cortesia.",
                badge: "Premium VIP",
                image: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                name: "Camuflagem de Grisalhos",
                category: "tratamento",
                price: 40.00,
                duration: 25,
                description: "Tonalização suave e natural para suavizar os fios brancos da barba ou do cabelo sem perder a masculinidade.",
                badge: "Rejuvenescimento",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 7,
                name: "Hidratação & Selagem Capilar",
                category: "tratamento",
                price: 50.00,
                duration: 30,
                description: "Tratamento profundo com queratina e óleos nobres para recuperar o brilho, maciez e vitalidade do couro cabeludo e fios.",
                badge: "Cuidados",
                image: "https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 8,
                name: "Styling VIP & Penteado",
                category: "corte",
                price: 30.00,
                duration: 20,
                description: "Lavagem especial com shampoo mentolado, secagem modelada e estilização com pomada e fixador para eventos.",
                badge: "Eventos",
                image: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // State variables
        let selectedServices = new Set();
        let currentCategory = 'all';

        // DOM Loaded Init
        document.addEventListener('DOMContentLoaded', () => {
            renderServices();
        });

        // Theme Toggle Functionality
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                html.classList.add('dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        }

        // Render Services Grid
        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'all' 
                ? services 
                : services.filter(s => s.category === currentCategory);

            filtered.forEach(service => {
                const isSelected = selectedServices.has(service.id);

                const card = document.createElement('div');
                card.className = `group relative rounded-2xl border transition-all duration-300 overflow-hidden cursor-pointer flex flex-col justify-between ${
                    isSelected 
                    ? 'border-amber-500 dark:bg-amber-500/10 bg-amber-50 shadow-lg shadow-amber-500/10' 
                    : 'dark:bg-darkcard bg-white dark:border-slate-800 border-slate-200 hover:border-amber-500/40 shadow-sm'
                }`;

                card.onclick = () => toggleSelectService(service.id);

                card.innerHTML = `
                    <div>
                        <!-- Image & Badge Container -->
                        <div class="relative h-48 w-full overflow-hidden bg-slate-800">
                            <img src="${service.image}" alt="${service.name}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=600&q=80'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                            
                            <!-- Category Badge -->
                            <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-amber-500/30 text-amber-400 text-[11px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                                ${service.badge}
                            </span>

                            <!-- Selection Indicator Checkbox -->
                            <div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all ${
                                isSelected 
                                ? 'bg-amber-500 border-amber-500 text-black scale-110' 
                                : 'border-white/60 bg-black/40 text-transparent'
                            }">
                                <i class="fa-solid fa-check text-sm font-bold"></i>
                            </div>

                            <!-- Duration Tag -->
                            <div class="absolute bottom-3 left-3 text-xs text-slate-300 flex items-center space-x-1 font-medium bg-black/40 px-2 py-0.5 rounded-md backdrop-blur-sm">
                                <i class="fa-regular fa-clock text-amber-400"></i>
                                <span>${service.duration} min</span>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="p-5 space-y-2">
                            <div class="flex justify-between items-start gap-2">
                                <h3 class="font-title font-bold text-lg leading-snug group-hover:text-amber-400 transition-colors">
                                    ${service.name}
                                </h3>
                            </div>
                            <p class="text-xs dark:text-slate-400 text-slate-600 line-clamp-2 leading-relaxed">
                                ${service.description}
                            </p>
                        </div>
                    </div>

                    <!-- Footer & Price -->
                    <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-slate-500/10 mt-auto">
                        <span class="text-xs uppercase tracking-wider font-semibold dark:text-slate-400 text-slate-500">Valor</span>
                        <div class="text-lg font-bold text-amber-500">
                            R$ ${service.price.toFixed(2).replace('.', ',')}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Filter Category Handler
        function filterCategory(cat) {
            currentCategory = cat;
            
            // Update active state of buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.classList.add('bg-amber-500', 'text-black', 'shadow-lg', 'shadow-amber-500/20');
                    btn.classList.remove('dark:bg-darkcard', 'bg-white', 'dark:text-slate-300', 'text-slate-700', 'border-slate-700/20');
                } else {
                    btn.classList.remove('bg-amber-500', 'text-black', 'shadow-lg', 'shadow-amber-500/20');
                    btn.classList.add('dark:bg-darkcard', 'bg-white', 'dark:text-slate-300', 'text-slate-700', 'border-slate-700/20');
                }
            });

            renderServices();
        }

        // Toggle Selection
        function toggleSelectService(id) {
            if (selectedServices.has(id)) {
                selectedServices.delete(id);
            } else {
                selectedServices.add(id);
            }

            renderServices();
            updateBookingBar();
        }

        // Update Floating Booking Bar
        function updateBookingBar() {
            const bar = document.getElementById('bookingBar');
            const countEl = document.getElementById('selectedCount');
            const priceEl = document.getElementById('totalPrice');
            const timeEl = document.getElementById('totalTime');

            if (selectedServices.size > 0) {
                let totalPrice = 0;
                let totalTime = 0;

                selectedServices.forEach(id => {
                    const item = services.find(s => s.id === id);
                    if (item) {
                        totalPrice += item.price;
                        totalTime += item.duration;
                    }
                });

                countEl.textContent = selectedServices.size;
                priceEl.textContent = totalPrice.toFixed(2).replace('.', ',');
                timeEl.textContent = `${totalTime} min`;

                bar.classList.remove('translate-y-full');
            } else {
                bar.classList.add('translate-y-full');
            }
        }

        // WhatsApp Redirection Logic
        function sendToWhatsApp() {
            if (selectedServices.size === 0) return;

            const phone = "5585989582114";
            let total = 0;
            let time = 0;

            let itemsList = "";
            selectedServices.forEach(id => {
                const item = services.find(s => s.id === id);
                if (item) {
                    itemsList += `• *${item.name}* (R$ ${item.price.toFixed(2).replace('.', ',')})\n`;
                    total += item.price;
                    time += item.duration;
                }
            });

            const message = `Olá, Barbearia Dom Navalha! 👋\n` +
                `Gostaria de agendar os seguintes serviços:\n\n` +
                `${itemsList}\n` +
                `⏱️ *Tempo Estimado:* ${time} min\n` +
                `💰 *Valor Total:* R$ ${total.toFixed(2).replace('.', ',')}\n\n` +
                `Quais os horários disponíveis?`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
